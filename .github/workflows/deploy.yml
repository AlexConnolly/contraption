name: Deploy to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: a half-published site is
# worse than an out-of-date one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The physics is covered headlessly, so a broken build never reaches the
      # site even though nobody is watching the deploy.
      - run: npm test
      - run: npm run build
      # Turns Pages on for the repo on the first run, so there is no click to
      # forget in the settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
