<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contraption — build a machine, solve the problem</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="loading"><span>Loading physics…</span></div>

    <header id="topbar">
      <div class="brand">Contrap<i>tion</i></div>
      <button id="btn-challenges" class="back">Back</button>
      <div class="mode-switch">
        <button id="mode-studio" class="mode active" data-mode="studio">Studio</button>
        <button id="mode-view" class="mode" data-mode="view">View</button>
      </div>
      <button id="mode-test" class="play" data-mode="test">Play</button>
      <div class="spacer"></div>
      <div id="budget" class="readout"></div>
      <div class="actions">
        <button id="btn-preset">Start from…</button>
        <button id="btn-save">Save</button>
        <button id="btn-load">Load</button>
        <button id="btn-clear" class="danger">Clear</button>
      </div>
    </header>

    <aside id="palette">
      <div class="panel-title">Parts</div>
      <div id="palette-list"></div>
      <div class="tools">
        <button class="tool active" data-tool="place">1 Place</button>
        <button class="tool" data-tool="select">2 Select</button>
        <button class="tool" data-tool="delete">3 Delete</button>
      </div>
    </aside>

    <div id="rail">
      <section id="brief" class="collapsed">
        <button id="brief-toggle" class="brief-head" type="button" aria-expanded="false">
          <span id="brief-title"></span>
          <span class="brief-chev" aria-hidden="true"></span>
        </button>
        <div id="brief-detail">
          <p id="brief-text"></p>
          <p id="brief-hint" class="hint"></p>
        </div>
      </section>

      <aside id="outliner">
        <div class="panel-title">
          Machine <span id="outliner-count"></span>
          <button id="outliner-new" type="button" title="Put the selection in a new group">+ Group</button>
        </div>
        <div id="outliner-body" class="empty">Nothing on the plate yet.</div>
      </aside>

      <aside id="inspector">
        <div class="panel-title">Inspector</div>
        <div id="inspector-body" class="empty">Select a part with the Select tool to set its controls.</div>
      </aside>
    </div>

    <section id="objectives" hidden>
      <div class="panel-title">Objectives</div>
      <ul id="objective-list"></ul>
      <div id="run-clock" class="readout"></div>
      <div class="test-controls">
        <button id="btn-respawn" class="ghost">Respawn (K)</button>
        <button id="btn-back" class="ghost">Back to Studio (Tab)</button>
      </div>
    </section>

    <div id="viewbar" hidden>
      <div class="survey-bar">
        <span id="view-goal" class="survey-caption"></span>
        <button id="view-tour">Take the tour</button>
        <button id="view-build" class="primary">Build it</button>
      </div>
    </div>

    <div id="survey" hidden>
      <div class="survey-bar">
        <span id="survey-step" class="survey-step"></span>
        <span id="survey-caption" class="survey-caption"></span>
        <button id="survey-skip" class="primary">Build it</button>
      </div>
    </div>

    <footer id="help"></footer>
    <div id="toast"></div>

    <div id="picker" hidden>
      <div class="picker-card">
        <h2>Start from</h2>
        <p>Load a machine onto the plate. Whatever is there now is replaced.</p>
        <div id="picker-grid" class="picker-grid"></div>
        <div class="picker-actions">
          <button id="picker-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div id="modal" hidden>
      <div class="modal-card">
        <h2 id="modal-title"></h2>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button id="modal-cancel">Stay here</button>
          <button id="modal-ok" class="primary">Leave</button>
        </div>
      </div>
    </div>

    <div id="win" hidden>
      <div class="win-card">
        <div id="win-kicker" class="win-kicker">Challenge complete</div>
        <h2 id="win-title"></h2>
        <div id="win-clock" class="win-clock"></div>
        <div id="win-stats"></div>
        <section id="win-rig" class="win-rig">
          <div class="label">What you used</div>
          <ul id="win-parts"></ul>
        </section>
        <div class="win-actions">
          <button id="win-again">Run again</button>
          <button id="win-studio">Keep tinkering</button>
          <button id="win-next" class="primary">Play next challenge</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
